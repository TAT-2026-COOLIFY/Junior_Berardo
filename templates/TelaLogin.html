<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PremiArte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='6') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-logo">
            <span class="material-symbols-rounded" style="font-size: 36px;">icecream</span>
        </div>

        <h2>PremiArte Açaí</h2>
        <p>Painel de Vendas & Estoque</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-message">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" style="width: 100%;">
            <div class="form-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" name="email" placeholder="Ex: admin@premiarte.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha Administrativa</label>
                <input type="password" id="password" name="password" placeholder="••••" required>
            </div>

            <button type="submit" class="btn-roxo">ENTRAR NO SISTEMA</button>
        </form>
    </div>

</body>
</html>
